<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="exoCone" x1="14" y1="50" x2="36" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rayGrad" x1="16" y1="48" x2="45" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="48%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="34" y1="10" x2="54" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="camGrad" x1="10" y1="40" x2="28" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Crisp light-studio squircle container -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Subtle 3D perspective field cone from Exo camera toward Ego target -->
  <path d="M16 48 L35 12 L52 29 Z" fill="url(#exoCone)"/>

  <!-- Subtle outer epipole halo around target -->
  <circle cx="44" cy="20" r="13.5" fill="#10b981" fill-opacity="0.10"/>

  <!-- Golden EgoRay beam (Exo -> Ego epipole) -->
  <line x1="17" y1="47" x2="44" y2="20" stroke="#f59e0b" stroke-width="5.5" stroke-linecap="round" stroke-opacity="0.24"/>
  <line x1="17" y1="47" x2="44" y2="20" stroke="url(#rayGrad)" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Exo Camera Frustum Wedge (bottom-left) -->
  <path d="M14.5 49.5 L20 33.5 L30.5 44 Z" fill="url(#camGrad)" fill-opacity="0.22" stroke="url(#camGrad)" stroke-width="2.6" stroke-linejoin="round"/>
  <circle cx="15" cy="49" r="3.6" fill="#0284c7" stroke="#ffffff" stroke-width="1.4"/>

  <!-- Ego Wearer Target Reticle (top-right) -->
  <circle cx="44" cy="20" r="9.5" fill="#ffffff" fill-opacity="0.72" stroke="url(#ringGrad)" stroke-width="3"/>
  <!-- Crosshair ticks -->
  <line x1="44" y1="7.5" x2="44" y2="12" stroke="#059669" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="44" y1="28" x2="44" y2="32.5" stroke="#059669" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="31.5" y1="20" x2="36" y2="20" stroke="#059669" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="52" y1="20" x2="56.5" y2="20" stroke="#059669" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Glowing amber-gold Ego epipole center -->
  <circle cx="44" cy="20" r="3.8" fill="#f59e0b" stroke="#ffffff" stroke-width="1.3"/>
</svg>
